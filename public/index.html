    <script type="text/javascript">
      $(".custom-navbar-toggler").click(function () {
        if ($(this).attr("aria-expanded") == "true") {
          $("body").addClass("scroll_hide");
          $("html").addClass("scroll_hide");
        } else {
          $("body").removeClass("scroll_hide");
          $("html").removeClass("scroll_hide");
        }
      });
    </script>

    <script>
      var swiper = new Swiper(".swiper-container.two", {
        loop: true,
        speed: 1000,
        // autoplay: {
        //     delay: 3000,
        // },
        effect: "coverflow",
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: "auto",
        coverflowEffect: {
          rotate: 0,
          stretch: 103,
          depth: 41,
          modifier: 3,
          slideShadows: false,
          watchSlidesVisibility: true,
        },

        // Navigation arrows
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        // Navigation Dots
        //   pagination: {
        //     el: ".swiper-pagination",
        //     clickable: true,
        //   },
        breakpoints: {
          1023: {
            coverflowEffect: {
              rotate: 0,
              stretch: 170,
              depth: 92,
              modifier: 2,
              slideShadows: false,
              watchSlidesVisibility: true,
            },
          },
          1024: {
            coverflowEffect: {
              rotate: 0,
              stretch: 110,
              depth: 25,
              modifier: 3,
              slideShadows: false,
              watchSlidesVisibility: true,
            },
          },
          767: {
            spaceBetween: 15,
            // Navigation Dots
            pagination: {
              el: ".swiper-pagination",
              clickable: true,
            },
            coverflowEffect: {
              rotate: 0,
              stretch: 0,
              depth: 25,
              modifier: 0,
              slideShadows: false,
              slidesPerView: "auto",
              watchSlidesVisibility: true,
            },
          },
        },
      });
    </script>
