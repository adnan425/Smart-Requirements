    <script type="text/javascript">
      $(".custom-navbar-toggler").click(function () {
        if ($(this).attr("aria-expanded") == "true") {
          $("body").addClass("scroll_hide");
          $("html").addClass("scroll_hide");
        } else {
          $("body").removeClass("scroll_hide");
          $("html").removeClass("scroll_hide");
        }
      });
    </script>
    <script>
      // feather.replace();
      var pctoggle = document.querySelector("#pct-toggler");
      if (pctoggle) {
        pctoggle.addEventListener("click", function () {
          if (
            !document
              .querySelector(".pct-customizer")
              .classList.contains("active")
          ) {
            document.querySelector(".pct-customizer").classList.add("active");
          } else {
            document
              .querySelector(".pct-customizer")
              .classList.remove("active");
          }
        });
      }
    </script>

    <script src="https://demo.rajodiya.com/crmgo-saas/assets/js/plugins/apexcharts.min.js"></script>
    <script>
      (function () {
        var options = {
          series: ["43"],
          chart: {
            height: 475,
            type: "radialBar",
            offsetY: -20,
            sparkline: {
              enabled: true,
            },
          },
          plotOptions: {
            radialBar: {
              startAngle: -90,
              endAngle: 90,
              track: {
                background: "#e7e7e7",

                margin: 5, // margin is in pixels
              },
              dataLabels: {
                name: {
                  show: true,
                },
                value: {
                  offsetY: -50,
                  fontSize: "20px",
                },
              },
            },
          },
          grid: {
            padding: {
              top: -10,
            },
          },
          colors: ["#51459d"],
          labels: ["Progress"],
        };
        var chart = new ApexCharts(
          document.querySelector("#milestone-chart"),
          options
        );
        chart.render();
      })();

      var options = {

          },
        },

      var options = {

      ///===================== Hour Chart =============================================================///
