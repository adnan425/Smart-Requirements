    <script type="text/javascript">
      var lnk = document.createElement("link");
      lnk.type = "text/css";
      const themeMode = localStorage.getItem("themeMode");
      if (themeMode != "dark") {
        lnk.href = "./../src/assets/css/style.css";
        lnk.rel = "stylesheet";
        document.getElementsByTagName("head")[0].appendChild(lnk);
      } else {
        lnk.href =
          "https://demo.rajodiya.com/taskly-saas/assets/css/style-dark.css";
        lnk.rel = "stylesheet";
        document.getElementsByTagName("head")[0].appendChild(lnk);
      }
    </script>

    </script>

      $(".custom-navbar-toggler").click(function () {
        if ($(this).attr("aria-expanded") == "true") {
          $("body").addClass("scroll_hide");
          $("html").addClass("scroll_hide");
        } else {
          $("body").removeClass("scroll_hide");
          $("html").removeClass("scroll_hide");
        }
      });
   
    </script>
